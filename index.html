<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F2E2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="מדריך הטיול לפאפוס ופיאה, קפריסין — 26–29 באוגוסט">
<title>אקאמאס 4 — המדריך שלנו לקפריסין</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Suez+One&display=swap" rel="stylesheet">
<style>
/* ============================================================
   אקאמאס 4 — עיצוב
   פלטה: חול גיר, ירוק־ים עמוק, חלודה של הספינה אדרו 3, טורקיז הלגונה
   ============================================================ */
:root{
  --deep:#0F2E2B;        /* ירוק־ים עמוק — שלד האפליקציה */
  --deep-2:#16403B;
  --rust:#B8482B;        /* חלודת ספינת אדרו 3 — כפתורי פעולה */
  --rust-dark:#973A22;
  --lagoon:#127A7E;      /* טורקיז הלגונה הכחולה — ניווט */
  --gold:#C08A2E;        /* עשב יבש / גיר — דירוגים */
  --paper:#EDEFE8;       /* אבן גיר בהירה — רקע */
  --card:#FFFFFF;
  --ink:#171A16;
  --ink-soft:#4E564C;
  --line:#D8DCD1;
  --shadow:0 1px 2px rgba(15,46,43,.06),0 8px 24px -12px rgba(15,46,43,.22);
  --nav-h:70px;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:17px;line-height:1.6;font-weight:400;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:'Suez One',serif;font-weight:400;line-height:1.2;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px;border-radius:6px}

/* ---------- כותרת עליונה ---------- */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--deep);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  box-shadow:0 2px 14px rgba(15,46,43,.28);
}
.topbar__row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.topbar h1{font-size:22px;letter-spacing:-.2px}
.topbar__sub{font-size:12.5px;opacity:.72;font-weight:600;letter-spacing:.3px;white-space:nowrap}

/* ---------- מסננת רדיוס ---------- */
.radius{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.radius::-webkit-scrollbar{display:none}
.radius__label{font-size:12px;opacity:.6;align-self:center;white-space:nowrap;font-weight:700;padding-left:2px}
.chip{
  flex:0 0 auto;padding:9px 15px;border-radius:999px;font-size:14px;font-weight:700;
  background:rgba(255,255,255,.11);color:#fff;min-height:38px;
  border:1.5px solid transparent;transition:background .15s,border-color .15s;
}
.chip[aria-pressed="true"]{background:#fff;color:var(--deep);border-color:#fff}

/* ---------- מסכים ---------- */
main{padding:18px 14px 28px;max-width:640px;margin:0 auto}
.screen{display:none;animation:rise .28s ease both}
.screen.is-active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.screen__intro{
  background:var(--deep-2);color:#fff;border-radius:var(--r);
  padding:18px 18px 20px;margin-bottom:18px;
}
.screen__intro h2{font-size:24px;margin-bottom:8px}
.screen__intro p{margin:0;font-size:15.5px;line-height:1.62;opacity:.9}
.screen__intro strong{color:#F2C87A;font-weight:700}

.count{
  font-size:13px;font-weight:700;color:var(--ink-soft);
  margin:0 2px 12px;display:flex;align-items:center;gap:8px;
}
.count::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- כרטיס ---------- */
.card{
  background:var(--card);border-radius:var(--r);margin-bottom:14px;
  box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line);
}
.card.is-hidden{display:none}
.card__head{
  width:100%;text-align:right;padding:16px 16px 14px;display:block;
  min-height:56px;
}
.card__top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card__name{font-size:19.5px;font-family:'Suez One',serif;line-height:1.25;flex:1}
.card__chev{
  flex:0 0 30px;height:30px;border-radius:50%;background:var(--paper);
  display:grid;place-items:center;transition:transform .25s;margin-top:2px;
}
.card.is-open .card__chev{transform:rotate(180deg);background:var(--rust)}
.card.is-open .card__chev svg{stroke:#fff}
.card__chev svg{width:16px;height:16px;stroke:var(--deep);stroke-width:2.6;fill:none}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{
  font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px;
  background:var(--paper);color:var(--ink-soft);white-space:nowrap;
}
.badge--star{background:#FBF2DC;color:#8A5F14}
.badge--price{background:#E6F1F0;color:#0B5D60}
.badge--tag{background:#F6E7E2;color:#8E3620}

/* ---------- מסילת המרחקים (אלמנט החתימה) ---------- */
.rail{display:flex;align-items:center;gap:0;margin-top:14px;padding:0 2px}
.rail__stop{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto;width:78px}
.rail__pin{
  width:11px;height:11px;border-radius:50%;background:var(--deep);
  box-shadow:0 0 0 3.5px rgba(15,46,43,.13);
}
.rail__stop--b .rail__pin{background:var(--rust);box-shadow:0 0 0 3.5px rgba(184,72,43,.15)}
.rail__min{font-size:16px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.rail__who{font-size:10.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.2px}
.rail__line{
  flex:1;height:0;border-top:2.5px dotted var(--line);margin:0 -4px;
  position:relative;top:-13px;
}
.rail__km{
  font-size:10.5px;color:var(--ink-soft);font-weight:700;
  position:absolute;top:-9px;right:50%;transform:translateX(50%);
  background:var(--card);padding:0 6px;white-space:nowrap;
}

/* ---------- גוף הכרטיס ---------- */
.card__body{display:none;padding:0 16px 16px;border-top:1px solid var(--line);margin-top:14px}
.card.is-open .card__body{display:block}
.card__body h4{
  font-family:'Assistant',sans-serif;font-size:12px;font-weight:800;letter-spacing:.8px;
  color:var(--ink-soft);margin:18px 0 5px;
}
.card__body h4:first-child{margin-top:16px}
.card__body p{margin:0;font-size:16px;line-height:1.68}
.card__body p+p{margin-top:9px}
.quote{
  border-right:3px solid var(--gold);padding:2px 12px 2px 0;
  font-size:15.5px;color:var(--ink-soft);font-style:normal;
}
.addr{font-size:15px;color:var(--ink-soft)}
.note{
  background:#FDF6E9;border:1px solid #EBD9AE;border-radius:12px;
  padding:11px 13px;font-size:14.5px;line-height:1.55;margin-top:14px;color:#6B4E12;
}
.note strong{color:#4A3406}
.note--warn{background:#FBEDE9;border-color:#EFCEC3;color:#8A3B25}
.note--warn strong{color:#6B2614}

/* ---------- כפתורי פעולה ---------- */
.actions{display:grid;gap:9px;margin-top:16px}
.actions--2{grid-template-columns:1fr 1fr}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;border-radius:14px;font-size:16.5px;font-weight:800;
  padding:0 14px;text-align:center;transition:transform .1s,filter .15s;
}
.btn:active{transform:scale(.975)}
.btn svg{width:19px;height:19px;flex:0 0 19px}
.btn--nav{background:var(--lagoon);color:#fff}
.btn--map{background:#E6F1F0;color:#0B5D60;border:1.5px solid #BFDDDC}
.btn--go{background:var(--rust);color:#fff}
.btn--call{background:var(--deep);color:#fff}
.btn--flat{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}

/* ---------- לוח מידע ---------- */
.info{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.info__row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:16px}
.info__row:last-child{border-bottom:none}
.info__row dt{color:var(--ink-soft);font-weight:600;margin:0}
.info__row dd{margin:0;font-weight:700;text-align:left}

/* ---------- יומן המסלול ---------- */
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.day__tag{display:inline-block;background:var(--deep);color:#fff;font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:8px;letter-spacing:.3px}
.day h3{font-size:20px;margin:11px 0 4px}
.day__note{font-size:14px;color:var(--ink-soft);margin:0 0 12px;font-weight:600}
.slot{display:flex;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}
.slot__time{flex:0 0 60px;font-size:13.5px;font-weight:800;color:var(--rust);padding-top:2px;font-variant-numeric:tabular-nums}
.slot__what{font-size:16px;line-height:1.55}
.slot__what b{font-weight:800}

/* ---------- צ'קליסט ---------- */
.task{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:right;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:9px;box-shadow:var(--shadow);min-height:56px;
}
.task__box{
  flex:0 0 26px;height:26px;border-radius:8px;border:2.5px solid var(--line);
  display:grid;place-items:center;margin-top:1px;transition:background .15s,border-color .15s;
}
.task.is-done .task__box{background:var(--lagoon);border-color:var(--lagoon)}
.task__box svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0}
.task.is-done .task__box svg{opacity:1}
.task__txt{font-size:16px;line-height:1.5}
.task.is-done .task__txt{opacity:.45;text-decoration:line-through}
.task__why{display:block;font-size:13.5px;color:var(--ink-soft);font-weight:600;margin-top:2px}

/* ---------- ניווט תחתון ---------- */
.tabs{
  position:fixed;bottom:0;right:0;left:0;z-index:70;
  background:var(--deep);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 18px rgba(15,46,43,.3);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:var(--nav-h);color:rgba(255,255,255,.55);position:relative;
  transition:color .15s;
}
.tab svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.9;fill:none}
.tab span{font-size:10.5px;font-weight:700;letter-spacing:0}
.tab svg{width:21px;height:21px}
@media (max-width:360px){.tab span{font-size:9.5px}.tab svg{width:19px;height:19px}}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"]::before{
  content:"";position:absolute;top:0;right:22%;left:22%;height:3px;
  background:var(--rust);border-radius:0 0 4px 4px;
}

/* ---------- כותרת תחתונה ---------- */
.foot{text-align:center;font-size:13px;color:var(--ink-soft);padding:22px 10px 6px;line-height:1.6}

@media (min-width:520px){
  body{font-size:17.5px}
  .card__name{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>

function rail(it){
  if(it.pickup){
    return `<div class="rail" aria-label="הסעה">
      <div class="rail__stop"><span class="rail__pin"></span><span class="rail__min">0 דק׳</span><span class="rail__who">מהמלון</span></div>
      <div class="rail__line"><span class="rail__km">אוספים אתכם</span></div>

    </div>`;
  }
  const h=it.hotel, p=it.peyia;
  const hk = h[0]===0 ? "במלון" : "≈"+h[0]+" ק״מ";
  return `<div class="rail" aria-label="זמן נסיעה">
    <div class="rail__stop"><span class="rail__pin"></span><span class="rail__min">${h[1]} דק׳</span><span class="rail__who">מהמלון</span></div>
    <div class="rail__line"><span class="rail__km">${hk}</span></div>
    <div class="rail__stop rail__stop--b"><span class="rail__pin"></span><span class="rail__min">${p[1]} דק׳</span><span class="rail__who">ממרכז פיאה</span></div>
  </div>`;
}

function card(it,i,key){
  const q = it.mapq || (it.name+" "+(it.addr||"")+" Cyprus");
  const tags=(it.tags||[]).map(t=>`<span class="badge badge--tag">${t}</span>`).join("");
  let acts=`<a class="btn btn--nav" href="https://waze.com/ul?q=${enc(q)}&navigate=yes" target="_blank" rel="noopener">${ICON.waze}ווייז</a>
             <a class="btn btn--map" href="https://www.google.com/maps/search/?api=1&query=${enc(q)}" target="_blank" rel="noopener">${ICON.map}מפות</a>`;
  const siteUrl = it.site || ("https://www.google.com/search?q="+enc(q));
  const siteLbl = it.site ? (it.siteLabel||"אתר רשמי") : "אתר, תפריט ושעות";
  let acts2=`<a class="btn btn--go" href="${siteUrl}" target="_blank" rel="noopener">${ICON.link}${siteLbl}</a>`;
  if(it.tel) acts2+=`<a class="btn btn--call" href="tel:${it.tel}">${ICON.phone}חייגו</a>`;

  return `<article class="card" data-min="${it.hotel[1]}" id="${key}-${i}">
    <button class="card__head" aria-expanded="false" aria-controls="b-${key}-${i}">
      <div class="card__top">
        <span class="card__name">${it.name}</span>
        <span class="card__chev">${ICON.chev}</span>
      </div>
      <div class="badges">
        <span class="badge badge--star">★ ${it.stars}</span>
        <span class="badge badge--price">${it.price}</span>
        ${tags}
      </div>
      ${rail(it)}
    </button>
    <div class="card__body" id="b-${key}-${i}">
      <h4>מה זה</h4><p>${it.desc}</p>
      ${it.reviews?`<h4>מה אומרים המבקרים</h4><p class="quote">${it.reviews}</p>`:""}
      <h4>כתובת</h4><p class="addr">${it.addr}</p>
      ${it.note?`<div class="note ${/אל תסמכו|לא נכנס|מבטל|קפיצות|אלכוהול|חייבים להזמין/.test(it.note)?"note--warn":""}">${it.note}</div>`:""}
      ${it.note2?`<div class="note">${it.note2}</div>`:""}
      <div class="actions actions--2">${acts}</div>
      <div class="actions ${it.tel?"actions--2":""}">${acts2}</div>
    </div>
  </article>`;
}

function build(){
  document.getElementById("s-home").innerHTML = HOME_HTML;
  document.getElementById("s-info").innerHTML = INFO_HTML;
  document.getElementById("s-limassol").innerHTML = LIMASSOL_HTML;

  Object.keys(SCREENS).forEach(key=>{
    const s=SCREENS[key];
    const items=DATA[key];
    document.getElementById("s-"+key).innerHTML =
      `<div class="screen__intro"><h2>${s.title}</h2><p>${s.intro}</p></div>
       <div class="count" data-count="${key}">${items.length} מקומות</div>` +
      items.map((it,i)=>card(it,i,key)).join("");
  });

  document.getElementById("tasklist").innerHTML = TASKS.map((t,i)=>
    `<button class="task" data-task="${i}" aria-pressed="false">
      <span class="task__box">${ICON.check}</span>
      <span class="task__txt">${t[0]}<span class="task__why">${t[1]}</span></span>
    </button>`).join("");
}

/* ---------- אינטראקציות ---------- */
document.addEventListener("click", e=>{
  const head = e.target.closest(".card__head");
  if(head){
    const c=head.closest(".card");
    const open=c.classList.toggle("is-open");
    head.setAttribute("aria-expanded", open?"true":"false");
    return;
  }
  const tab = e.target.closest(".tab");
  if(tab){
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected","false"));
    tab.setAttribute("aria-selected","true");
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("is-active"));
    document.getElementById(tab.dataset.screen).classList.add("is-active");
    document.getElementById("scr-title").textContent = tab.dataset.title;
    window.scrollTo({top:0,behavior:"smooth"});
    return;
  }
  const chip = e.target.closest(".chip");
  if(chip){
    document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
    chip.setAttribute("aria-pressed","true");
    filter(+chip.dataset.radius);
    return;
  }
  const task = e.target.closest(".task");
  if(task){
    const done=task.classList.toggle("is-done");
    task.setAttribute("aria-pressed", done?"true":"false");
  }
});

function filter(max){
  Object.keys(SCREENS).forEach(key=>{
    let shown=0;
    document.querySelectorAll("#s-"+key+" .card").forEach(c=>{
      const ok = +c.dataset.min <= max;
      c.classList.toggle("is-hidden", !ok);
      if(ok) shown++;
    });
    const label=document.querySelector('#s-'+key+' [data-count]');
    if(label) label.textContent = max>=999 ? shown+" מקומות" : shown+" מקומות עד "+max+" דקות מהמלון";
  });
}

build();
